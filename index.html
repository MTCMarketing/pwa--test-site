
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#4a5fd4">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="description" content="">
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: #ffffff; color: #16202c;
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 24px;
  }
  main { width: min(100%, 420px); text-align: center; }
  img { width: 96px; height: 96px; border-radius: 22px; }
  h1 { margin: 18px 0 6px; font-size: 24px; }
  p { margin: 0 0 18px; opacity: 0.75; }
  button {
    width: 100%; padding: 14px 18px; border: 0; border-radius: 12px;
    background: #4a5fd4; color: #fff; font-size: 16px; font-weight: 600; cursor: pointer;
  }
  button[disabled] { opacity: 0.55; cursor: default; }
  #said { margin-top: 14px; font-size: 14px; min-height: 1.6em; }
</style>
</head>
<body>
<main>
  <img src="icons/icon-192.png" alt="">
  <h1>Test</h1>
  <p>Turn on alerts for this site.</p>
  <button id="go">Turn on alerts</button>
  <p id="said"></p>
</main>

<script>
/* Generated by Entity Tracker. The Worker it talks to holds the
   subscriptions; the key below is the PUBLIC half of the pair, which is
   the only half a page is ever given. */

const WORKER = "https://test-alerts.makethemcall.workers.dev";
const SW_URL = "sw.js";

const say = (words) => {
  document.getElementById("said").textContent = words;
};

const urlBase64ToUint8Array = (base64) => {
  const padded = (
    base64 + "=".repeat((4 - (base64.length % 4)) % 4)
  ).replace(/-/g, "+").replace(/_/g, "/");

  const raw = atob(padded);

  return Uint8Array.from(
    [...raw].map((c) => c.charCodeAt(0))
  );
};

// Register or update without using the HTTP cache.
async function registerAndUpdate() {
  const registration = await navigator.serviceWorker.register(
    SW_URL,
    {
      updateViaCache: "none"
    }
  );

  // Explicitly check for the latest sw.js.
  await registration.update();

  console.log("[SW] Update checked");
  console.log("[SW] Active:", registration.active?.state);
  console.log("[SW] Waiting:", registration.waiting?.state);
  console.log("[SW] Installing:", registration.installing?.state);

  return registration;
}

// Automatically update ONLY if a service worker
// is already registered for this PWA.
//
// New visitors are not registered or subscribed.
async function updateExistingInstallation() {
  if (!("serviceWorker" in navigator)) {
    return;
  }

  try {
    const registration =
      await navigator.serviceWorker.getRegistration(SW_URL);

    if (!registration) {
      console.log("[SW] No existing registration. Waiting for user.");
      return;
    }

    console.log("[SW] Existing registration found.");

    // Preserve the existing registration and subscription.
    await registerAndUpdate();

  } catch (error) {
    console.error("[SW] Automatic update failed:", error);
  }
}

// Check existing installations when the page opens.
// No notification permission request happens here.
updateExistingInstallation();

// Subscribe only after the user clicks the button.
async function turnOn() {
  const button = document.getElementById("go");
  button.disabled = true;

  try {
    if (
      !("serviceWorker" in navigator) ||
      !("PushManager" in window)
    ) {
      return say("This browser cannot take push notifications.");
    }

    // On iOS this only works once the page is on the Home Screen.
    const onIos = /iPad|iPhone|iPod/.test(navigator.userAgent);

    if (onIos && !window.navigator.standalone) {
      return say(
        "On iPhone and iPad: add this to your Home Screen first " +
        "(Share, then Add to Home Screen), then open it from there."
      );
    }

    // Permission is requested ONLY following the button click.
    const permission = await Notification.requestPermission();

    if (permission !== "granted") {
      return say(
        "Notifications were " + permission +
        ". It has to be changed in this site's settings now."
      );
    }

    // Register or update the service worker.
    const registration = await registerAndUpdate();

    await navigator.serviceWorker.ready;

    const key = await fetch(WORKER + "/key")
      .then((r) => r.json());

    if (!key.publicKey) {
      return say("The alerts server has no key yet.");
    }

    // Reuse existing push subscription whenever possible.
    let subscription =
      await registration.pushManager.getSubscription();

    if (!subscription) {
      subscription = await registration.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlBase64ToUint8Array(key.publicKey)
      });
    }

    // Send subscription to the alerts server.
    const kept = await fetch(WORKER + "/subscribe", {
      method: "POST",
      headers: {
        "content-type": "application/json"
      },
      body: JSON.stringify(subscription.toJSON())
    });

    if (!kept.ok) {
      throw new Error(
        "the alerts server answered " + kept.status
      );
    }

    say(
      "Done. This device will get alerts, " +
      "even with this page closed."
    );

  } catch (error) {
    say("That did not work: " + error.message);
    console.error("[PWA] Enrollment failed:", error);
  } finally {
    button.disabled = false;
  }
}

document.getElementById("go")
  .addEventListener("click", turnOn);
</script>
</body>
</html>
